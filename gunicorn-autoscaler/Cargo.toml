[package]
name = "gunicorn-autoscaler"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Gunicorn autoscaling wrapper (dynamic workers via StatsD + TTIN/TTOU)"
repository = "https://github.com/yourusername/gunicorn-autoscaler"
keywords = ["gunicorn", "autoscaling", "fastapi", "uvicorn", "ops"]
categories = ["command-line-utilities", "web-programming::http-server"]
readme = "README.md"

[dependencies]
anyhow = "1"
hdrhistogram = "7"
libc = "0.2"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
